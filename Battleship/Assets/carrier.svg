<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 525 100">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa7b4"/>
      <stop offset="0.5" stop-color="#7e8c9a"/>
      <stop offset="1" stop-color="#5f6c7a"/>
    </linearGradient>
  </defs>
  <!-- flight deck: angled-deck silhouette -->
  <path d="M 14 50
           C 14 34 30 26 52 24
           L 430 18
           C 470 18 508 34 516 50
           C 508 66 470 82 430 82
           L 52 76
           C 30 74 14 66 14 50 Z"
        fill="url(#hull)" stroke="#36414d" stroke-width="4"/>
  <!-- deck surface -->
  <path d="M 28 50 C 28 40 40 35 56 34 L 428 29 C 460 29 490 40 497 50 C 490 60 460 71 428 71 L 56 66 C 40 65 28 60 28 50 Z"
        fill="#4b5663"/>
  <!-- runway centerline -->
  <line x1="48" y1="50" x2="480" y2="50" stroke="#e8eaed" stroke-width="5" stroke-dasharray="22 14" opacity="0.85"/>
  <!-- angled runway stripe -->
  <line x1="150" y1="63" x2="340" y2="40" stroke="#ffbe0b" stroke-width="4" stroke-dasharray="16 10" opacity="0.7"/>
  <!-- deck edge numbers pad (bow) -->
  <circle cx="462" cy="50" r="9" fill="none" stroke="#e8eaed" stroke-width="3" opacity="0.8"/>
  <!-- island superstructure -->
  <rect x="300" y="12" width="64" height="24" rx="5" fill="#3b4652" stroke="#222b33" stroke-width="3"/>
  <rect x="314" y="16" width="18" height="10" rx="2" fill="#9fd8ff" opacity="0.9"/>
  <rect x="340" y="16" width="10" height="10" rx="2" fill="#9fd8ff" opacity="0.7"/>
  <!-- radar mast -->
  <line x1="332" y1="12" x2="332" y2="2" stroke="#222b33" stroke-width="4"/>
  <circle cx="332" cy="3" r="3.5" fill="#ff4d4d"/>
  <!-- parked aircraft silhouettes -->
  <g fill="#2c333c" opacity="0.9">
    <path d="M 90 42 l 16 4 -16 4 4 -4 Z"/>
    <path d="M 120 56 l 16 4 -16 4 4 -4 Z"/>
    <path d="M 70 58 l 16 4 -16 4 4 -4 Z"/>
  </g>
</svg>
