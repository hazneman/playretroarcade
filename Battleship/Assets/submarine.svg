<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 100">
  <defs>
    <linearGradient id="subhull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdf6b"/>
      <stop offset="0.5" stop-color="#ffc233"/>
      <stop offset="1" stop-color="#e09a1e"/>
    </linearGradient>
    <linearGradient id="subsail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d4d"/>
      <stop offset="1" stop-color="#e07020"/>
    </linearGradient>
  </defs>
  <!-- teardrop hull: rounded stern, tapered bow -->
  <path d="M 20 50
           C 20 33 44 27 76 27
           L 200 27
           C 262 29 296 44 304 50
           C 296 56 262 71 200 73
           L 76 73
           C 44 73 20 67 20 50 Z"
        fill="url(#subhull)" stroke="#8a5c10" stroke-width="4"/>
  <!-- waterline accent stripe -->
  <path d="M 30 58 C 60 62 240 62 292 54" fill="none" stroke="#e8542f" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <!-- deck line -->
  <line x1="44" y1="38" x2="252" y2="36" stroke="#b97c14" stroke-width="3" opacity="0.8"/>
  <!-- conning tower (sail) -->
  <rect x="140" y="34" width="52" height="30" rx="12" fill="url(#subsail)" stroke="#8a5c10" stroke-width="3"/>
  <rect x="152" y="42" width="16" height="12" rx="4" fill="#4dd9ff" stroke="#8a5c10" stroke-width="2"/>
  <!-- periscopes -->
  <line x1="158" y1="34" x2="158" y2="20" stroke="#8a5c10" stroke-width="4"/>
  <line x1="174" y1="34" x2="174" y2="25" stroke="#8a5c10" stroke-width="4"/>
  <circle cx="158" cy="18" r="3.5" fill="#ff4d4d"/>
  <circle cx="174" cy="24" r="3" fill="#4dd9ff"/>
  <!-- bow dive planes -->
  <line x1="262" y1="38" x2="282" y2="30" stroke="#c7691c" stroke-width="5" stroke-linecap="round"/>
  <line x1="262" y1="62" x2="282" y2="70" stroke="#c7691c" stroke-width="5" stroke-linecap="round"/>
  <!-- stern planes + propeller -->
  <line x1="36" y1="38" x2="22" y2="28" stroke="#c7691c" stroke-width="5" stroke-linecap="round"/>
  <line x1="36" y1="62" x2="22" y2="72" stroke="#c7691c" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="17" cy="50" rx="4" ry="11" fill="#e8542f" opacity="0.9"/>
  <!-- porthole windows -->
  <g fill="#4dd9ff" stroke="#8a5c10" stroke-width="2">
    <circle cx="212" cy="50" r="5.5"/>
    <circle cx="232" cy="50" r="5.5"/>
    <circle cx="252" cy="49" r="5.5"/>
  </g>
  <!-- bubbles from the bow -->
  <g fill="none" stroke="#9fe8ff" stroke-width="2" opacity="0.8">
    <circle cx="298" cy="34" r="3"/>
    <circle cx="306" cy="24" r="4"/>
    <circle cx="311" cy="13" r="2.5"/>
  </g>
</svg>
