<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 100">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa7b4"/>
      <stop offset="0.5" stop-color="#7e8c9a"/>
      <stop offset="1" stop-color="#5f6c7a"/>
    </linearGradient>
  </defs>
  <!-- sleek hull -->
  <path d="M 14 50
           C 14 34 30 28 52 28
           L 220 28
           C 270 28 298 42 306 50
           C 298 58 270 72 220 72
           L 52 72
           C 30 72 14 66 14 50 Z"
        fill="url(#hull)" stroke="#36414d" stroke-width="4"/>
  <!-- deck -->
  <path d="M 26 50 C 26 42 38 37 54 37 L 218 37 C 258 37 282 45 290 50 C 282 55 258 63 218 63 L 54 63 C 38 63 26 58 26 50 Z"
        fill="#505b68"/>
  <!-- helipad aft -->
  <circle cx="62" cy="50" r="13" fill="none" stroke="#e8eaed" stroke-width="3" opacity="0.8"/>
  <text x="62" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e8eaed" opacity="0.8">H</text>
  <!-- superstructure -->
  <rect x="120" y="36" width="70" height="28" rx="5" fill="#3b4652" stroke="#222b33" stroke-width="3"/>
  <rect x="130" y="42" width="18" height="15" rx="3" fill="#9fd8ff" opacity="0.85"/>
  <rect x="156" y="42" width="12" height="15" rx="3" fill="#9fd8ff" opacity="0.6"/>
  <line x1="178" y1="36" x2="178" y2="20" stroke="#222b33" stroke-width="4"/>
  <circle cx="178" cy="19" r="3.5" fill="#ff4d4d"/>
  <!-- fore turret, barrels to the bow -->
  <g>
    <line x1="228" y1="45" x2="258" y2="45" stroke="#2c333c" stroke-width="4"/>
    <line x1="228" y1="55" x2="258" y2="55" stroke="#2c333c" stroke-width="4"/>
    <circle cx="222" cy="50" r="12" fill="#3b4652" stroke="#222b33" stroke-width="3"/>
  </g>
</svg>
