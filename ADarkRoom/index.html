	<script>
		// try to read "lang" param's from url
		var lang = decodeURIComponent((new RegExp('[?|&]lang=' + '([^&;]+?)(&|#|;|$)').exec(location.search)||[,""])[1].replace(/\+/g, '%20'))||null;
		// if no language requested, try to read it from local storage
		if(!lang){
			try {
				lang = localStorage.lang;
			} catch(e) {}
		}
		// if a language different than english requested, load all translations
		if(lang && lang != 'en'){
			document.write('<script src="lang/'+lang+'/strings.js"><\/script>');
			document.write('<link rel="stylesheet" type="text/css" href="lang/'+lang+'/main.css" \/>');
		}
	</script>

	<style>
	div#notifications { padding-top: 46px; } /* room for the fixed Home pill */
	/* Make it obvious WHY an event choice is unavailable: show its cost
	   inline on the button instead of only in a hover tooltip. */
	#event .button.disabled {
		opacity: 0.5;
		border-style: dashed !important;
		cursor: not-allowed;
	}
	#event .button.disabled div.tooltip {
		display: block;
		position: static;
		width: auto;
		border: none;
		background: none;
		box-shadow: none;
		color: inherit;
		font-size: 11px;
		padding: 3px 0 0;
		margin: 0;
	}
	#event .button.disabled div.tooltip::before { content: "needs "; }
	#event .button.disabled div.tooltip .row_key,
	#event .button.disabled div.tooltip .row_val {
		float: none;
		display: inline;
		width: auto;
		text-align: left;
	}
	#event .button.disabled div.tooltip .row_val::before { content: " "; }
	#event .button.disabled div.tooltip .row_val::after { content: "  "; }
	#praIntro {
		position: fixed;
		top: 52px;
		right: 18px;
		width: 300px;
		max-width: calc(100vw - 40px);
		border: 1px solid currentColor;
		background: rgba(128, 128, 128, 0.07);
		padding: 14px 16px;
		font-size: 14px;
		line-height: 1.55;
		z-index: 998;
	}
	#praIntro button {
		margin-top: 10px;
		border: 1px solid currentColor;
		background: none;
		color: inherit;
		font: inherit;
		font-size: 13px;
		padding: 4px 12px;
		cursor: pointer;
	}
	</style>
	<div id="praIntro" style="display:none;">
		Playing for the first time? Click <b>light fire</b> and keep it burning.
		The story reveals itself slowly: new buttons and places appear as you
		gather resources. There is no way to lose early &mdash; patience is the game.
		<br><button id="praIntroBtn">got it.</button>
	</div>
	<script>
	(function () {
		try {
			if (!localStorage.getItem('praADRHintSeen') && !localStorage.getItem('gameState')) {
				var el = document.getElementById('praIntro');
				el.style.display = 'block';
				document.getElementById('praIntroBtn').onclick = function () {
					el.style.display = 'none';
					try { localStorage.setItem('praADRHintSeen', '1'); } catch (e) {}
				};
			}
		} catch (e) {}
	})();
	</script>
	<link rel="stylesheet" href="../Public/arcade.css">
	<script src="../Public/leaderboard.js"></script>
	<script>
	// PlayRetroArcade shell: when a run ends (the screen that says
	// "score for this game"), offer the shared leaderboard. Monkey-patches
	// the ending hook from outside - vendored game scripts stay untouched.
	window.addEventListener('load', function () {
		if (!window.Space || !window.Score || !window.ArcadeLB) return;
		var orig = Space.showEndingOptions;
		Space.showEndingOptions = function () {
			var ret = orig.apply(this, arguments);
			try {
				var sc = Score.calculateScore();
				setTimeout(function () {
					ArcadeLB.offerSubmit('darkroom', sc, document.querySelector('.centerCont'));
				}, 2500);
			} catch (e) {}
			return ret;
		};
	});
	</script>
